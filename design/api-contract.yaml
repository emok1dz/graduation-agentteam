openapi: 3.0.3
info:
  title: 在线考试系统 API 契约
  version: 1.0.0
  description: |
    前后端唯一接口依据（系统架构师产出）。

    ## 通用约定
    - 基础路径：所有接口以 `/api` 开头；静态前端由同一端口的 `/` 提供。
    - 编码：请求与响应均为 `application/json; charset=utf-8`（导出接口为 `text/csv`）。请求体上限 1MB，超过返回 413/41300。
    - 字段命名：统一 snake_case。时间：统一 ISO8601 UTC 字符串（`Date.prototype.toISOString()`，如 `2026-11-05T08:00:00.000Z`）。ID：正整数。
    - 分数：number，最多 1 位小数；平均分保留 2 位小数；百分比（pass_rate / correct_rate / score_rate / ratio）为 0~100 的 number，保留 1 位小数。
    - 鉴权：除 `POST /api/auth/login` 外均需请求头 `Authorization: Bearer <token>`。令牌空闲 2 小时过期（滑动续期）。
    - 角色：`admin` 管理员 / `teacher` 教师 / `student` 学生。每个接口的 `x-roles` 列出允许的角色；角色不符返回 403/40300；资源归属不符返回 403/40301。
    - 统一响应：`{ "code": 0, "message": "ok", "data": ... }`；失败时 `code` 为业务码（见 `x-error-codes` 与系统设计文档 §10），`data` 为 null 或错误详情。
    - 分页：查询参数 `page`（默认 1，≥1）与 `page_size`（默认 10，1~100）；分页响应 `data = { items, total, page, page_size }`。
    - 枚举：
      - 题型 `type`：single 单选 / multiple 多选 / judge 判断 / fill 填空 / essay 简答
      - 难度 `difficulty`：easy / medium / hard
      - 用户状态 `status`：active / disabled
      - 考试状态 `status`（服务端按时间计算）：not_started / ongoing / ended / cancelled
      - 答卷状态 `submission.status`（持久化值）：in_progress 作答中 / pending_review 待批改 / graded 已批改
      - 交卷方式 `submit_type`：manual 手动 / auto 前端到时自动 / forced 服务端超时强制 / absent 缺考
    - 标准答案 `answer` 与学生作答 `response` 的形状随题型变化：
      | type | answer（标准答案） | response（学生作答） |
      | --- | --- | --- |
      | single | `"A"` | `"A"` |
      | multiple | `["A","C"]`（≥2 个，升序） | `["A","C"]` |
      | judge | `true` / `false` | `true` / `false` |
      | fill | `[["北京","Beijing"],["1949"]]` 每空一组可接受答案 | `["北京","1949"]`，长度 = blank_count |
      | essay | `"参考答案"` 或 null | `"作答文本"`（≤2000 字） |
      未作答的 response 为 null。
    - 可选（P1/P2）接口在 summary 中以【可选】标注，并带 `x-optional: true`。
servers:
  - url: http://localhost:3000
tags:
  - name: auth
    description: 认证与会话（FR-AUTH）
  - name: users
    description: 用户管理（FR-USER）
  - name: classes
    description: 班级管理（FR-CLASS）
  - name: tags
    description: 知识点标签（FR-QB-04）
  - name: questions
    description: 题库（FR-QB）
  - name: papers
    description: 组卷与试卷（FR-PAPER）
  - name: exams
    description: 考试发布与管理（FR-EXAM-01/02）
  - name: student
    description: 学生端考试与成绩（FR-EXAM-03、FR-ANS-01、FR-STAT-01）
  - name: submissions
    description: 答卷作答、交卷、批改（FR-ANS、FR-GRADE）
  - name: grading
    description: 阅卷与成绩发布（FR-GRADE）
  - name: stats
    description: 成绩单与统计（FR-STAT）
  - name: admin
    description: 系统概览（FR-STAT-06）
security:
  - bearerAuth: []

paths:
  # ===================== AUTH =====================
  /api/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: 登录（FR-AUTH-01）
      description: |
        账号不存在或密码错误统一返回 40101；连续 5 次密码错误锁定 10 分钟（42900）；被禁用返回 40302。
      security: []
      x-roles: [public]
      x-error-codes: [40000, 40001, 40101, 40302, 42900]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LoginResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: 退出登录（FR-AUTH-02）
      description: 立即使当前令牌失效。
      x-roles: [admin, teacher, student]
      x-error-codes: [40100]
      responses:
        '200': { $ref: '#/components/responses/OkNull' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: 获取当前用户（刷新后恢复登录态，FR-AUTH-02）
      x-roles: [admin, teacher, student]
      x-error-codes: [40100]
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/auth/password:
    put:
      tags: [auth]
      operationId: changePassword
      summary: 修改本人密码（FR-AUTH-03，P1）
      description: |
        校验原密码（错误返回 40003）；新密码 6~32 位且同时含字母与数字、两次一致、不得与原密码相同（否则 40000）。
        成功后该用户除当前会话外的其他会话全部失效。
      x-roles: [admin, teacher, student]
      x-error-codes: [40000, 40003, 40100]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200': { $ref: '#/components/responses/OkNull' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ===================== USERS =====================
  /api/users:
    get:
      tags: [users]
      operationId: listUsers
      summary: 用户列表（FR-USER-01）
      description: 按 created_at 倒序分页。响应永不包含密码哈希与盐。
      x-roles: [admin]
      x-error-codes: [40000, 40100, 40300]
      parameters:
        - name: role
          in: query
          schema: { $ref: '#/components/schemas/Role' }
        - name: class_id
          in: query
          schema: { type: integer }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/UserStatus' }
        - name: keyword
          in: query
          description: 账号或姓名模糊匹配（不区分大小写）
          schema: { type: string, maxLength: 50 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 分页用户列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageMeta'
                          - type: object
                            properties:
                              items:
                                type: array
                                items: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [users]
      operationId: createUser
      summary: 新增用户（FR-USER-02）
      description: |
        username 4~20 位 `[A-Za-z0-9_]` 且唯一（重复 40900）；name 1~20 字；role=student 时 class_id 必填且班级存在；
        password 留空则使用配置的默认初始密码（config.DEFAULT_PASSWORD）；填写时须满足 6~32 位字母+数字。
      x-roles: [admin]
      x-error-codes: [40000, 40100, 40300, 40400, 40900]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreateRequest' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/users/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [users]
      operationId: getUser
      summary: 用户详情
      x-roles: [admin]
      x-error-codes: [40100, 40300, 40400]
      responses:
        '200':
          description: 用户
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [users]
      operationId: updateUser
      summary: 编辑 / 禁用 / 启用用户（FR-USER-03）
      description: |
        仅可修改 name、class_id（仅学生）、status；username 与 role 不可改（出现即忽略）。
        status 改为 disabled 时立即删除该用户全部会话；管理员不能禁用自己（40303）。
      x-roles: [admin]
      x-error-codes: [40000, 40100, 40300, 40303, 40400]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdateRequest' }
      responses:
        '200':
          description: 更新后的用户
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [users]
      operationId: deleteUser
      summary: 【可选】删除用户（FR-USER-03 P1）
      description: |
        已产生答卷的学生、已创建题目或考试的教师不允许删除（40901，只能禁用）；不能删除自己（40303）。
        删除时级联删除其会话与任课关系。
      x-optional: true
      x-roles: [admin]
      x-error-codes: [40100, 40300, 40303, 40400, 40901]
      responses:
        '200': { $ref: '#/components/responses/OkNull' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/users/{id}/reset-password:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [users]
      operationId: resetUserPassword
      summary: 重置密码为默认初始密码（FR-USER-03）
      description: 密码重置为 config.DEFAULT_PASSWORD，清除登录锁定，并删除该用户全部会话。响应不回传密码。
      x-roles: [admin]
      x-error-codes: [40100, 40300, 40400]
      responses:
        '200': { $ref: '#/components/responses/OkNull' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ===================== CLASSES =====================
  /api/classes:
    get:
      tags: [classes]
      operationId: listClasses
      summary: 班级列表（FR-CLASS-01）
      description: |
        admin：全部班级；teacher：本人任课班级；student：本人所在班级（0 或 1 条）。按 name 升序分页。
      x-roles: [admin, teacher, student]
      x-error-codes: [40000, 40100]
      parameters:
        - name: keyword
          in: query
          description: 班级名称/专业模糊匹配
          schema: { type: string, maxLength: 50 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 分页班级列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageMeta'
                          - type: object
                            properties:
                              items:
                                type: array
                                items: { $ref: '#/components/schemas/ClassInfo' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [classes]
      operationId: createClass
      summary: 新增班级（FR-CLASS-01）
      description: name 全局唯一（重复 40900）。
      x-roles: [admin]
      x-error-codes: [40000, 40100, 40300, 40900]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClassInput' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ClassInfo' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/classes/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [classes]
      operationId: getClass
      summary: 班级详情
      description: admin 任意；teacher 仅任课班级；student 仅本人班级；否则 40301。
      x-roles: [admin, teacher, student]
      x-error-codes: [40100, 40301, 40400]
      responses:
        '200':
          description: 班级
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ClassInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [classes]
      operationId: updateClass
      summary: 编辑班级（FR-CLASS-01）
      x-roles: [admin]
      x-error-codes: [40000, 40100, 40300, 40400, 40900]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClassInput' }
      responses:
        '200':
          description: 更新后的班级
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ClassInfo' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [classes]
      operationId: deleteClass
      summary: 删除班级（FR-CLASS-01）
      description: 班级下仍有学生或存在关联考试时返回 40901。删除时同时删除任课关系。
      x-roles: [admin]
      x-error-codes: [40100, 40300, 40400, 40901]
      responses:
        '200': { $ref: '#/components/responses/OkNull' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/classes/{id}/members:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [classes]
      operationId: getClassMembers
      summary: 班级成员（学生名单与任课教师，FR-CLASS-02）
      description: admin 任意班级；teacher 仅任课班级（只读）；否则 40301。学生按 username 升序。
      x-roles: [admin, teacher]
      x-error-codes: [40100, 40300, 40301, 40400]
      responses:
        '200':
          description: 成员
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ClassMembers' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/classes/{id}/students:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [classes]
      operationId: addClassStudents
      summary: 将学生加入班级（FR-CLASS-02）
      description: |
        student_ids 必须均为学生账号（否则 40000）。若有学生已属于其他班级且 force_move=false，
        整体不执行并返回 409/40909，data.conflicts 列出冲突学生，前端二次确认后以 force_move=true 重试。
      x-roles: [admin]
      x-error-codes: [40000, 40100, 40300, 40400, 40909]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddStudentsRequest' }
      responses:
        '200':
          description: 更新后的成员
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ClassMembers' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 学生已属于其他班级（40909）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MoveConflictData' }
  /api/classes/{id}/students/remove:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [classes]
      operationId: removeClassStudents
      summary: 将学生移出班级（FR-CLASS-02）
      description: 仅移出属于本班的学生，其 class_id 置为 null；不属于本班的 ID 忽略。
      x-roles: [admin]
      x-error-codes: [40000, 40100, 40300, 40400]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StudentIdsRequest' }
      responses:
        '200':
          description: 更新后的成员
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ClassMembers' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/classes/{id}/teachers:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    put:
      tags: [classes]
      operationId: setClassTeachers
      summary: 设置任课教师（整体替换，FR-CLASS-02）
      description: teacher_ids 必须均为教师账号（否则 40000），可为空数组。
      x-roles: [admin]
      x-error-codes: [40000, 40100, 40300, 40400]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeacherIdsRequest' }
      responses:
        '200':
          description: 更新后的成员
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ClassMembers' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ===================== TAGS =====================
  /api/tags:
    get:
      tags: [tags]
      operationId: listTags
      summary: 本人知识点标签列表（FR-QB-04）
      description: 返回当前教师全部标签（不分页），按 name 升序，含关联题目数（不含已删除题目）。
      x-roles: [teacher]
      x-error-codes: [40100, 40300]
      responses:
        '200':
          description: 标签数组
