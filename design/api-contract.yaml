  /api/submissions/{id}/answers:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    put:
      tags: [submissions]
      operationId: saveAnswers
      summary: 自动保存答案（增量，FR-ANS-03）
      description: |
        仅本人答卷（40301）；status 非 in_progress 返回 40904；now > deadline_at + 10s 时先强制交卷（submit_type=forced）再返回 40906。
        answers 中仅出现的题目被覆盖（增量）；paper_question_id 不属于该试卷或 response 形状与题型不符返回 40000。
      x-roles: [student]
      x-error-codes: [40000, 40100, 40300, 40301, 40400, 40904, 40906]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveAnswersRequest' }
      responses:
        '200':
          description: 保存成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SaveAnswersResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/submissions/{id}/submit:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [submissions]
      operationId: submitSubmission
      summary: 交卷（幂等，FR-ANS-04/05）
      description: |
        仅本人答卷（40301）。在同一事务内：
        1. status ≠ in_progress → 409/40904，data 为当前 SubmitResult，任何数据不变；
        2. now ≤ deadline_at + 10s → 先合并 body.answers（同保存规则），submit_type = auto ? 'auto' : 'manual'，submitted_at = now，answers_accepted=true；
        3. now > deadline_at + 10s → 忽略 body.answers，按已保存答案交卷，submit_type='forced'，submitted_at = deadline_at，answers_accepted=false（仍返回 200）；
        4. 立即执行客观题自动阅卷，status 置为 pending_review（含简答题）或 graded。
      x-roles: [student]
      x-error-codes: [40000, 40100, 40300, 40301, 40400, 40904]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitRequest' }
      responses:
        '200':
          description: 交卷成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SubmitResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 已交卷，请勿重复提交（40904）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SubmitResult' }
  /api/submissions/{id}/grades:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    put:
      tags: [grading]
      operationId: gradeSubmission
      summary: 简答题评分（FR-GRADE-02）
      description: |
        仅本人考试（40301）；答卷 status 须为 pending_review 或 graded（否则 40902）；成绩已发布 40908。
        grades 中 paper_question_id 必须是该试卷的 essay 题；0 ≤ score ≤ 题目分值，最多 1 位小数（40000）。
        可部分评分（按题目逐题批改时每次只传一题）。全部简答题均有分数后：subjective_score = Σ简答得分，
        total_score = objective_score + subjective_score，status = graded；成绩发布前可重复修改。
      x-roles: [teacher]
      x-error-codes: [40000, 40100, 40300, 40301, 40400, 40902, 40908]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GradeRequest' }
      responses:
        '200':
          description: 评分结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/GradeResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

