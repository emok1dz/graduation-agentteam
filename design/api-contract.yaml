      summary: 发布考试（FR-EXAM-01）
      description: |
        校验：end_time > start_time > 当前时间；1 ≤ duration_minutes ≤ (end_time - start_time) 分钟；
        0 ≤ pass_score ≤ 试卷总分（缺省为总分 × 60%，保留 1 位小数）；paper_id 须为本人试卷（40301）；
        class_ids 非空且均为本人任课班级（40301）。发布后试卷锁定。
      x-roles: [teacher]
      x-error-codes: [40000, 40100, 40300, 40301, 40400]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExamInput' }
      responses:
        '201':
          description: 发布成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Exam' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
