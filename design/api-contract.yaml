        首次调用创建答卷：started_at = now，deadline_at = min(now + duration, end_time)，并为每道试题创建 response=null 的作答记录；
        再次调用返回原答卷，不重置 started_at。若该答卷已超过 deadline_at + 10s，先强制交卷再返回 40904。
