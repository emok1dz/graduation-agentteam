                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/StatsSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/exams/{id}/stats/distribution:
    parameters:
      - $ref: '#/components/parameters/IdPath'
      - $ref: '#/components/parameters/ClassIdQuery'
    get:
      tags: [stats]
      operationId: getStatsDistribution
      summary: 分数段分布（FR-STAT-04）
      description: |
        统计对象同 summary。得分率 r = total_score / 试卷总分；固定 5 段：
        [0,60%)、[60%,70%)、[70%,80%)、[80%,90%)、[90%,100%]（最后一段闭区间）。ratio = count / 实考人数 × 100。
      x-roles: [teacher, admin]
      x-error-codes: [40000, 40100, 40300, 40301, 40400]
      responses:
        '200':
          description: 分布
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/StatsDistribution' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/exams/{id}/stats/questions:
    parameters:
      - $ref: '#/components/parameters/IdPath'
      - $ref: '#/components/parameters/ClassIdQuery'
    get:
      tags: [stats]
      operationId: getStatsQuestions
      summary: 每题正确率分析（FR-STAT-05）
      description: |
        统计对象同 summary。客观题 correct_rate = 得满分人数 / 实考人数 × 100；简答题 correct_rate 为 null。
        所有题 score_rate = 平均得分 / 题目分值 × 100。single/multiple 返回 option_stats（各选项被选人数）。
        sort=rate_asc 时按 score_rate 升序（相同则按 seq）。
      x-roles: [teacher, admin]
      x-error-codes: [40000, 40100, 40300, 40301, 40400]
      parameters:
        - name: sort
          in: query
          schema:
            type: string
            enum: [seq, rate_asc]
            default: seq
      responses:
        '200':
          description: 题目分析
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [actual_count, items]
                        properties:
                          actual_count: { type: integer }
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/QuestionStat' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ===================== ADMIN =====================
  /api/admin/overview:
    get:
      tags: [admin]
      operationId: getOverview
      summary: 【可选】系统数据概览（FR-STAT-06 P2）
      x-optional: true
      x-roles: [admin]
      x-error-codes: [40100, 40300]
      responses:
        '200':
          description: 概览
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Overview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 登录返回的 64 位十六进制令牌（32 字节随机数）

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      description: 资源 ID（正整数；非法格式返回 40000）
      schema: { type: integer, minimum: 1 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
    ClassIdQuery:
      name: class_id
      in: query
      required: false
      description: 按参考班级过滤；缺省为全部参考班级
      schema: { type: integer, minimum: 1 }

  responses:
    OkNull:
      description: 成功，data 为 null
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data: { nullable: true, type: object, example: null }
    BadRequest:
      description: 参数错误（40000 校验失败，data.errors 为字段级错误；40001 JSON 非法；40003 原密码错误）
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  data:
                    nullable: true
                    allOf:
                      - $ref: '#/components/schemas/ValidationErrorData'
    Unauthorized:
      description: 40100 未登录或会话失效 / 40101 账号或密码错误
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: 40300 角色无权限 / 40301 资源归属不符 / 40302 账号已禁用 / 40303 不能对自己执行该操作
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: 40400 资源不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: 409 业务冲突（40900~40909，见 x-error-codes）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Insufficient:
      description: 42200 题量不足
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/ShortageData' }
    TooManyRequests:
      description: 42900 连续登录失败，账号锁定
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      locked_until: { type: string, format: date-time }

  schemas:
    # ---------- 通用 ----------
    Envelope:
      type: object
      required: [code, message, data]
      properties:
        code: { type: integer, example: 0, description: '0 表示成功' }
        message: { type: string, example: ok }
        data: { nullable: true }
    ErrorEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code: { type: integer, example: 40000, description: 业务错误码 }
        message: { type: string, example: 参数校验失败 }
        data: { nullable: true }
    ValidationErrorData:
      type: object
      required: [errors]
      properties:
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string, example: 'items[2].score', description: 字段路径（数组用下标） }
              message: { type: string, example: 分值必须为正数且最多 1 位小数 }
    PageMeta:
      type: object
      required: [items, total, page, page_size]
      properties:
        items: { type: array, items: {} }
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
    Role:
      type: string
      enum: [admin, teacher, student]
    UserStatus:
      type: string
      enum: [active, disabled]
    QuestionType:
      type: string
      enum: [single, multiple, judge, fill, essay]
    Difficulty:
      type: string
      enum: [easy, medium, hard]
    ExamStatus:
      type: string
      enum: [not_started, ongoing, ended, cancelled]
    SubmissionStatus:
      type: string
      enum: [in_progress, pending_review, graded]
    SubmitType:
      type: string
      nullable: true
      enum: [manual, auto, forced, absent, null]
    UserBrief:
      type: object
      required: [id, username, name]
      properties:
        id: { type: integer }
        username: { type: string }
        name: { type: string }
    ClassBrief:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }

    # ---------- AUTH / USER ----------
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 20 }
        password: { type: string, minLength: 1, maxLength: 64 }
    LoginResult:
      type: object
      required: [token, expires_at, user]
      properties:
        token: { type: string, example: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08 }
        expires_at: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/User' }
    ChangePasswordRequest:
      type: object
      required: [old_password, new_password, confirm_password]
      properties:
        old_password: { type: string, minLength: 1, maxLength: 64 }
        new_password: { type: string, minLength: 6, maxLength: 32, description: 须同时包含字母与数字 }
        confirm_password: { type: string }
    User:
      type: object
      description: 对外用户视图（不含 password_hash / password_salt / 锁定字段）
      required: [id, username, name, role, class_id, class_name, status, created_at, updated_at]
      properties:
        id: { type: integer }
        username: { type: string, example: student1 }
        name: { type: string, example: 张三 }
        role: { $ref: '#/components/schemas/Role' }
        class_id: { type: integer, nullable: true, description: 仅学生有值 }
        class_name: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/UserStatus' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    UserCreateRequest:
      type: object
      required: [username, name, role]
      properties:
        username: { type: string, pattern: '^[A-Za-z0-9_]{4,20}$' }
        name: { type: string, minLength: 1, maxLength: 20 }
        role: { $ref: '#/components/schemas/Role' }
        password: { type: string, nullable: true, minLength: 6, maxLength: 32, description: 留空使用默认初始密码 }
        class_id: { type: integer, nullable: true, description: role=student 时必填 }
    UserUpdateRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 20 }
        class_id: { type: integer, nullable: true, description: 仅对学生有效 }
        status: { $ref: '#/components/schemas/UserStatus' }

    # ---------- CLASS ----------
    ClassInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 30, example: 计科2101 }
        grade: { type: string, maxLength: 10, example: '2021', default: '' }
        major: { type: string, maxLength: 30, example: 计算机科学与技术, default: '' }
        remark: { type: string, maxLength: 200, default: '' }
    ClassInfo:
      type: object
      required: [id, name, grade, major, remark, student_count, teachers, created_at, updated_at]
      properties:
        id: { type: integer }
        name: { type: string }
        grade: { type: string }
        major: { type: string }
        remark: { type: string }
        student_count: { type: integer }
        teachers:
          type: array
          items: { $ref: '#/components/schemas/UserBrief' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ClassMembers:
      type: object
      required: [class, students, teachers]
      properties:
        class: { $ref: '#/components/schemas/ClassInfo' }
        students:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/UserBrief'
              - type: object
                properties:
                  status: { $ref: '#/components/schemas/UserStatus' }
        teachers:
          type: array
          items: { $ref: '#/components/schemas/UserBrief' }
    AddStudentsRequest:
      type: object
      required: [student_ids]
      properties:
        student_ids:
          type: array
          minItems: 1
          maxItems: 500
          items: { type: integer }
        force_move: { type: boolean, default: false, description: 为 true 时把已属于其他班级的学生转入本班 }
    StudentIdsRequest:
      type: object
      required: [student_ids]
      properties:
        student_ids:
          type: array
          minItems: 1
          maxItems: 500
          items: { type: integer }
    TeacherIdsRequest:
      type: object
      required: [teacher_ids]
      properties:
        teacher_ids:
          type: array
          maxItems: 50
          items: { type: integer }
    MoveConflictData:
      type: object
      required: [conflicts]
      properties:
        conflicts:
          type: array
          items:
            type: object
            properties:
              student_id: { type: integer }
              username: { type: string }
              name: { type: string }
              current_class_id: { type: integer }
              current_class_name: { type: string }

    # ---------- TAG / QUESTION ----------
    TagInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 20 }
    Tag:
      type: object
      required: [id, name, question_count, created_at]
      properties:
        id: { type: integer }
        name: { type: string }
        question_count: { type: integer }
        created_at: { type: string, format: date-time }
    QuestionOption:
      type: object
      required: [key, text]
      properties:
        key: { type: string, pattern: '^[A-H]$', description: 按顺序 A、B、C… }
        text: { type: string, minLength: 1, maxLength: 500 }
    AnswerValue:
      description: |
        标准答案 / 学生作答，形状随题型（见 info.description 表）。
        single: string；multiple: string[]；judge: boolean；fill: string[][]（标准答案）或 string[]（作答）；essay: string。
      nullable: true
      oneOf:
        - type: string
        - type: boolean
        - type: array
          items: { type: string }
        - type: array
          items:
            type: array
            items: { type: string }
    QuestionInput:
      type: object
      required: [type, stem, difficulty, score]
      description: |
        校验规则（违反返回 40000，field 指明字段）：
        - stem 1~2000 字；score > 0 且最多 1 位小数；tags 0~5 个，每个 1~20 字，去重；analysis ≤ 2000 字。
        - single/multiple：options 2~8 个，key 必须依次为 A、B、C…；single 的 answer 为某个 key；
          multiple 的 answer 为 ≥2 个不重复 key（服务端升序存储）。
        - judge：options 忽略（存为 []）；answer 为 boolean。
        - fill：stem 中 `___`（三个下划线）的个数 = blank_count ≥ 1；answer 为长度等于 blank_count 的数组，
          每项为 1~10 个非空可接受答案字符串（前端将 “答案1|答案2” 拆分为数组）。
        - essay：answer 为参考答案字符串（≤2000 字）或 null。
      properties:
        type: { $ref: '#/components/schemas/QuestionType' }
        stem: { type: string, minLength: 1, maxLength: 2000 }
        options:
          type: array
          items: { $ref: '#/components/schemas/QuestionOption' }
        answer: { $ref: '#/components/schemas/AnswerValue' }
        analysis: { type: string, maxLength: 2000, default: '' }
        difficulty: { $ref: '#/components/schemas/Difficulty' }
        tags:
          type: array
          maxItems: 5
          items: { type: string, minLength: 1, maxLength: 20 }
        score: { type: number, exclusiveMinimum: true, minimum: 0, maximum: 100, example: 2 }
    Question:
      type: object
      required: [id, type, stem, options, answer, analysis, difficulty, tags, score, blank_count, ref_count, created_at, updated_at]
      properties:
        id: { type: integer }
        type: { $ref: '#/components/schemas/QuestionType' }
        stem: { type: string }
        options:
          type: array
          items: { $ref: '#/components/schemas/QuestionOption' }
        answer: { $ref: '#/components/schemas/AnswerValue' }
        analysis: { type: string }
        difficulty: { $ref: '#/components/schemas/Difficulty' }
        tags:
          type: array
          items: { type: string }
        score: { type: number }
        blank_count: { type: integer, description: 填空题空数，其他题型为 0 }
        ref_count: { type: integer, description: 被多少份试卷引用 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    QuestionPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [summary]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Question' }
            summary:
              type: object
              properties:
                by_type:
                  type: object
                  properties:
                    single: { type: integer }
                    multiple: { type: integer }
                    judge: { type: integer }
                    fill: { type: integer }
                    essay: { type: integer }
                by_difficulty:
                  type: object
                  properties:
                    easy: { type: integer }
                    medium: { type: integer }
                    hard: { type: integer }
    ImportQuestionsRequest:
      type: object
      required: [questions]
      properties:
        questions:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: '#/components/schemas/QuestionInput' }
    ImportResult:
      type: object
      required: [success_count, fail_count, failures]
      properties:
        success_count: { type: integer }
        fail_count: { type: integer }
        failures:
          type: array
          items:
            type: object
            properties:
              index: { type: integer, description: 在 questions 数组中的下标（从 0 开始） }
              errors:
                type: array
                items:
                  type: object
                  properties:
                    field: { type: string }
                    message: { type: string }

    # ---------- PAPER ----------
    PaperInput:
      type: object
      required: [title, items]
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500, default: '' }
        items:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required: [question_id, score]
            properties:
              question_id: { type: integer }
              score: { type: number, exclusiveMinimum: true, minimum: 0, maximum: 100 }
    PaperQuestion:
      type: object
      description: 试卷中的题目快照
      required: [id, seq, question_id, type, stem, options, answer, analysis, difficulty, tags, score, blank_count]
      properties:
        id: { type: integer, description: paper_question_id }
        seq: { type: integer, description: 题号，从 1 开始 }
        question_id: { type: integer, nullable: true, description: 来源题目 ID }
        type: { $ref: '#/components/schemas/QuestionType' }
        stem: { type: string }
        options:
          type: array
          items: { $ref: '#/components/schemas/QuestionOption' }
        answer: { $ref: '#/components/schemas/AnswerValue' }
        analysis: { type: string }
        difficulty: { $ref: '#/components/schemas/Difficulty' }
        tags:
          type: array
          items: { type: string }
        score: { type: number }
        blank_count: { type: integer }
    TypeStat:
      type: object
      required: [type, count, score]
      properties:
        type: { $ref: '#/components/schemas/QuestionType' }
        count: { type: integer }
        score: { type: number, description: 该题型小计分值 }
    PaperSummary:
      type: object
      required: [id, title, description, question_count, total_score, exam_ref_count, locked, created_at, updated_at]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        question_count: { type: integer }
        total_score: { type: number }
        exam_ref_count: { type: integer, description: 被考试引用次数（含已取消） }
        locked: { type: boolean, description: exam_ref_count > 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PaperDetail:
      allOf:
        - $ref: '#/components/schemas/PaperSummary'
        - type: object
          required: [type_stats, questions]
          properties:
            type_stats:
              type: array
              items: { $ref: '#/components/schemas/TypeStat' }
            questions:
              type: array
              items: { $ref: '#/components/schemas/PaperQuestion' }
    RandomRule:
      type: object
      required: [type, count, score]
      properties:
        type: { $ref: '#/components/schemas/QuestionType' }
        count: { type: integer, minimum: 1, maximum: 100 }
        score: { type: number, exclusiveMinimum: true, minimum: 0, maximum: 100, description: 每题分值 }
        difficulty: { allOf: [{ $ref: '#/components/schemas/Difficulty' }], nullable: true }
        tags:
          type: array
          description: 命中任一标签即可；空数组/缺省表示不限
          items: { type: string }
    RandomGenerateRequest:
      type: object
      required: [rules]
      properties:
        rules:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/RandomRule' }
    RandomDraft:
      type: object
      required: [items, total_score]
      properties:
        items:
          type: array
          items:
            type: object
            required: [rule_index, score, question]
            properties:
              rule_index: { type: integer, description: 对应 rules 下标 }
              score: { type: number }
              question: { $ref: '#/components/schemas/Question' }
        total_score: { type: number }
    RandomReplaceRequest:
      type: object
      required: [type, exclude_question_ids]
      properties:
        type: { $ref: '#/components/schemas/QuestionType' }
        difficulty: { allOf: [{ $ref: '#/components/schemas/Difficulty' }], nullable: true }
        tags:
          type: array
          items: { type: string }
        exclude_question_ids:
          type: array
          items: { type: integer }
    ShortageData:
      type: object
      required: [shortages]
      properties:
        shortages:
          type: array
          items:
            type: object
            properties:
              rule_index: { type: integer }
              type: { $ref: '#/components/schemas/QuestionType' }
              difficulty: { type: string, nullable: true }
              tags:
                type: array
                items: { type: string }
              available: { type: integer }
              required: { type: integer }

    # ---------- EXAM ----------
    ExamInput:
      type: object
      required: [title, paper_id, start_time, end_time, duration_minutes, class_ids]
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 1000, default: '' }
        paper_id: { type: integer }
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time }
        duration_minutes: { type: integer, minimum: 1, maximum: 1440 }
        class_ids:
          type: array
          minItems: 1
          items: { type: integer }
        pass_score: { type: number, nullable: true, description: 缺省为试卷总分 × 60% }
        shuffle_options: { type: boolean, default: false, description: 【可选 P2】选项乱序 }
    ExamUpdateRequest:
      type: object
      description: 字段同 ExamInput，均可选；ongoing 状态仅允许 end_time
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 1000 }
        paper_id: { type: integer }
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time }
        duration_minutes: { type: integer, minimum: 1, maximum: 1440 }
        class_ids:
          type: array
          minItems: 1
          items: { type: integer }
        pass_score: { type: number }
        shuffle_options: { type: boolean }
    ExamCounts:
      type: object
      required: [expected, started, submitted, pending_review, graded, absent]
      properties:
        expected: { type: integer, description: 应考人数（参考班级当前学生数） }
        started: { type: integer, description: 作答中人数 }
        submitted: { type: integer, description: 已交卷人数（pending_review + graded，不含缺考） }
        pending_review: { type: integer, description: 待批改份数 }
        graded: { type: integer, description: 已批改份数（不含缺考） }
        absent: { type: integer, description: 缺考人数 }
    Exam:
      type: object
      required: [id, title, description, paper_id, paper_title, total_score, question_count, start_time, end_time,
                 duration_minutes, pass_score, shuffle_options, status, classes, teacher, results_published,
                 results_published_at, allow_review, cancelled_at, counts, created_at, updated_at]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        paper_id: { type: integer }
        paper_title: { type: string }
        total_score: { type: number }
        question_count: { type: integer }
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time }
        duration_minutes: { type: integer }
        pass_score: { type: number }
        shuffle_options: { type: boolean }
        status: { $ref: '#/components/schemas/ExamStatus' }
        classes:
          type: array
          items: { $ref: '#/components/schemas/ClassBrief' }
        teacher: { $ref: '#/components/schemas/UserBrief' }
        results_published: { type: boolean }
        results_published_at: { type: string, format: date-time, nullable: true }
        allow_review: { type: boolean }
        cancelled_at: { type: string, format: date-time, nullable: true }
        counts: { $ref: '#/components/schemas/ExamCounts' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ExamMonitor:
      type: object
      required: [exam_id, status, server_time, items]
      properties:
        exam_id: { type: integer }
        status: { $ref: '#/components/schemas/ExamStatus' }
        server_time: { type: string, format: date-time }
        items:
          type: array
          items:
            type: object
            required: [student_id, username, name, class_id, class_name, state, submission_id, started_at, submitted_at, submit_type]
            properties:
              student_id: { type: integer }
              username: { type: string }
              name: { type: string }
              class_id: { type: integer }
              class_name: { type: string }
              state:
                type: string
                enum: [not_started, in_progress, submitted, absent]
              submission_id: { type: integer, nullable: true }
              started_at: { type: string, format: date-time, nullable: true }
              submitted_at: { type: string, format: date-time, nullable: true }
              submit_type: { $ref: '#/components/schemas/SubmitType' }

    # ---------- STUDENT ----------
    StudentExam:
      type: object
      required: [id, title, description, start_time, end_time, duration_minutes, total_score, question_count, pass_score,
                 student_status, submission_id, submission_status, results_published]
      properties:
        id: { type: integer, description: exam_id }
        title: { type: string }
        description: { type: string }
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time }
        duration_minutes: { type: integer }
        total_score: { type: number }
        question_count: { type: integer }
        pass_score: { type: number }
        student_status:
          type: string
          description: |
            not_started 未开始（now < start_time）；available 可开始（窗口内、无答卷）；in_progress 可继续（窗口内、答卷作答中）；
            finished 已交卷（含被强制交卷）；missed 已错过（窗口结束且无答卷或为缺考记录）
          enum: [not_started, available, in_progress, finished, missed]
        submission_id: { type: integer, nullable: true }
        submission_status: { allOf: [{ $ref: '#/components/schemas/SubmissionStatus' }], nullable: true }
        results_published: { type: boolean }
    StudentQuestion:
      type: object
      description: 学生作答视图（不含 answer / analysis）
      required: [id, seq, type, stem, options, score, blank_count]
      properties:
        id: { type: integer, description: paper_question_id }
        seq: { type: integer }
        type: { $ref: '#/components/schemas/QuestionType' }
        stem: { type: string }
        options:
          type: array
          items: { $ref: '#/components/schemas/QuestionOption' }
        score: { type: number }
        blank_count: { type: integer }
    AnswerItem:
      type: object
      required: [paper_question_id, response]
      properties:
        paper_question_id: { type: integer }
        response: { $ref: '#/components/schemas/AnswerValue' }
    AnswerSheet:
      type: object
      required: [submission_id, exam, started_at, deadline_at, server_time, last_saved_at, questions, answers]
      properties:
        submission_id: { type: integer }
        exam:
          type: object
          properties:
            id: { type: integer }
            title: { type: string }
            description: { type: string }
            total_score: { type: number }
            duration_minutes: { type: integer }
            start_time: { type: string, format: date-time }
            end_time: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        deadline_at: { type: string, format: date-time }
        server_time: { type: string, format: date-time, description: 前端据此计算时钟偏移 }
        last_saved_at: { type: string, format: date-time, nullable: true }
        questions:
          type: array
          items: { $ref: '#/components/schemas/StudentQuestion' }
        answers:
          type: array
          description: 每题一项（未作答 response 为 null）
          items: { $ref: '#/components/schemas/AnswerItem' }
    SaveAnswersRequest:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: '#/components/schemas/AnswerItem' }
    SaveAnswersResult:
      type: object
      required: [saved_at, server_time, deadline_at]
      properties:
        saved_at: { type: string, format: date-time }
        server_time: { type: string, format: date-time }
        deadline_at: { type: string, format: date-time, description: 考试被延长时会变化 }
    SubmitRequest:
      type: object
      properties:
        answers:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/AnswerItem' }
        auto: { type: boolean, default: false, description: 倒计时归零前端自动提交时为 true }
    SubmitResult:
      type: object
      required: [submission_id, status, submit_type, submitted_at, answers_accepted]
      properties:
        submission_id: { type: integer }
        status: { $ref: '#/components/schemas/SubmissionStatus' }
        submit_type: { $ref: '#/components/schemas/SubmitType' }
        submitted_at: { type: string, format: date-time }
        answers_accepted: { type: boolean, description: 本次请求携带的答案是否被采纳 }
    StudentResultItem:
      type: object
      required: [exam_id, exam_title, submission_id, status, submit_type, submitted_at, results_published, total_score, full_score, passed]
      properties:
        exam_id: { type: integer }
        exam_title: { type: string }
        submission_id: { type: integer }
        status: { $ref: '#/components/schemas/SubmissionStatus' }
        submit_type: { $ref: '#/components/schemas/SubmitType' }
        submitted_at: { type: string, format: date-time, nullable: true }
        results_published: { type: boolean }
        total_score: { type: number, nullable: true, description: 未发布时为 null }
        full_score: { type: number, description: 试卷总分 }
        passed: { type: boolean, nullable: true, description: 未发布时为 null }
    ReviewQuestion:
      type: object
      description: 答卷回顾的一题
      required: [id, seq, type, stem, options, score, blank_count, response, correct_answer, analysis, got_score, is_correct, comment]
      properties:
        id: { type: integer, description: paper_question_id }
        seq: { type: integer }
        type: { $ref: '#/components/schemas/QuestionType' }
        stem: { type: string }
        options:
          type: array
          items: { $ref: '#/components/schemas/QuestionOption' }
        score: { type: number, description: 题目分值 }
        blank_count: { type: integer }
        response: { $ref: '#/components/schemas/AnswerValue' }
        correct_answer: { $ref: '#/components/schemas/AnswerValue' }
        analysis: { type: string }
        got_score: { type: number, nullable: true, description: 简答未批改时为 null }
        is_correct: { type: boolean, nullable: true, description: 客观题是否得满分；简答为 null }
        comment: { type: string, nullable: true }
    SubmissionScore:
      type: object
      required: [id, status, submit_type, started_at, deadline_at, submitted_at, objective_score, subjective_score, total_score, passed]
      properties:
        id: { type: integer }
        status: { $ref: '#/components/schemas/SubmissionStatus' }
        submit_type: { $ref: '#/components/schemas/SubmitType' }
        started_at: { type: string, format: date-time, nullable: true }
        deadline_at: { type: string, format: date-time, nullable: true }
        submitted_at: { type: string, format: date-time, nullable: true }
        objective_score: { type: number, nullable: true }
        subjective_score: { type: number, nullable: true }
        total_score: { type: number, nullable: true }
        passed: { type: boolean, nullable: true }
    StudentResultDetail:
      type: object
      required: [exam, submission, results_published, allow_review, questions]
      properties:
        exam:
          type: object
          properties:
            id: { type: integer }
            title: { type: string }
            total_score: { type: number }
            pass_score: { type: number }
        submission: { $ref: '#/components/schemas/SubmissionScore' }
        results_published: { type: boolean }
        allow_review: { type: boolean }
        questions:
          type: array
          description: 仅 results_published 且 allow_review 时非空
          items: { $ref: '#/components/schemas/ReviewQuestion' }
    SubmissionDetail:
      type: object
      required: [exam, student, submission, questions]
      properties:
        exam:
          type: object
          properties:
            id: { type: integer }
            title: { type: string }
            total_score: { type: number }
            pass_score: { type: number }
            results_published: { type: boolean }
        student:
          allOf:
            - $ref: '#/components/schemas/UserBrief'
            - type: object
              properties:
                class_id: { type: integer }
                class_name: { type: string }
        submission: { $ref: '#/components/schemas/SubmissionScore' }
        questions:
          type: array
          items: { $ref: '#/components/schemas/ReviewQuestion' }

    # ---------- GRADING ----------
    GradeRequest:
      type: object
      required: [grades]
      properties:
        grades:
          type: array
          minItems: 1
          items:
            type: object
            required: [paper_question_id, score]
            properties:
              paper_question_id: { type: integer }
              score: { type: number, minimum: 0 }
              comment: { type: string, maxLength: 500, nullable: true }
    GradeResult:
      type: object
      required: [submission_id, status, objective_score, subjective_score, total_score, essay_graded, essay_total]
      properties:
        submission_id: { type: integer }
        status: { $ref: '#/components/schemas/SubmissionStatus' }
        objective_score: { type: number }
        subjective_score: { type: number, nullable: true, description: 未全部批完时为已批部分之和 }
        total_score: { type: number, nullable: true, description: 全部批完前为 null }
        essay_graded: { type: integer }
        essay_total: { type: integer }
    GradingOverview:
      type: object
      required: [exam_id, results_published, progress, essay_questions, submissions]
      properties:
        exam_id: { type: integer }
        results_published: { type: boolean }
        progress:
          type: object
          required: [total, graded, pending]
          properties:
            total: { type: integer, description: 已交卷份数（不含缺考） }
            graded: { type: integer }
            pending: { type: integer }
        essay_questions:
          type: array
          items:
            type: object
            properties:
              paper_question_id: { type: integer }
              seq: { type: integer }
              stem: { type: string }
              score: { type: number }
              graded_count: { type: integer }
              total_count: { type: integer }
        submissions:
          type: array
          items:
            type: object
            properties:
              submission_id: { type: integer }
              student:
                allOf:
                  - $ref: '#/components/schemas/UserBrief'
                  - type: object
                    properties:
                      class_name: { type: string }
              status: { $ref: '#/components/schemas/SubmissionStatus' }
              submitted_at: { type: string, format: date-time }
              objective_score: { type: number }
              total_score: { type: number, nullable: true }
              essay_graded: { type: integer }
              essay_total: { type: integer }
    GradingQuestionAnswers:
      type: object
      required: [question, items]
      properties:
        question:
          type: object
          properties:
            paper_question_id: { type: integer }
            seq: { type: integer }
            stem: { type: string }
            score: { type: number }
            reference_answer: { type: string, nullable: true }
            analysis: { type: string }
        items:
          type: array
          items:
            type: object
            properties:
              submission_id: { type: integer }
              student: { $ref: '#/components/schemas/UserBrief' }
              response: { type: string, nullable: true }
              score: { type: number, nullable: true }
              comment: { type: string, nullable: true }
              graded_at: { type: string, format: date-time, nullable: true }
    PublishResultsRequest:
      type: object
      properties:
        allow_review: { type: boolean, default: true, description: 是否允许学生查看答案与解析 }

    # ---------- STATS ----------
    ScoreRow:
      type: object
      required: [rank, student_id, username, name, class_id, class_name, submission_id, status, submit_type, submitted_at,
                 objective_score, subjective_score, total_score, passed]
      properties:
        rank: { type: integer, nullable: true }
        student_id: { type: integer }
        username: { type: string, description: 学号 }
        name: { type: string }
        class_id: { type: integer }
        class_name: { type: string }
        submission_id: { type: integer, nullable: true }
        status:
          type: string
          description: not_started 表示尚无答卷（考试未结束时）
          enum: [not_started, in_progress, pending_review, graded]
        submit_type: { $ref: '#/components/schemas/SubmitType' }
        submitted_at: { type: string, format: date-time, nullable: true }
        objective_score: { type: number, nullable: true }
        subjective_score: { type: number, nullable: true }
        total_score: { type: number, nullable: true }
        passed: { type: boolean, nullable: true, description: 仅 graded 行有值 }
    ScoreSheet:
      type: object
      required: [exam, items]
      properties:
        exam:
          type: object
          properties:
            id: { type: integer }
            title: { type: string }
            total_score: { type: number }
            pass_score: { type: number }
            status: { $ref: '#/components/schemas/ExamStatus' }
            results_published: { type: boolean }
            classes:
              type: array
              items: { $ref: '#/components/schemas/ClassBrief' }
        items:
          type: array
          items: { $ref: '#/components/schemas/ScoreRow' }
    SummaryMetrics:
      type: object
      required: [expected_count, actual_count, absent_count, pending_count, average_score, max_score, min_score, pass_count, pass_rate]
      properties:
        expected_count: { type: integer }
        actual_count: { type: integer }
        absent_count: { type: integer }
        pending_count: { type: integer, description: 作答中 + 待批改份数（未计入统计） }
        average_score: { type: number, nullable: true, description: 保留 2 位小数 }
        max_score: { type: number, nullable: true }
        min_score: { type: number, nullable: true }
        pass_count: { type: integer }
        pass_rate: { type: number, description: 百分比，保留 1 位小数 }
    StatsSummary:
      allOf:
        - $ref: '#/components/schemas/SummaryMetrics'
        - type: object
          required: [total_score, pass_score, by_class]
          properties:
            total_score: { type: number }
            pass_score: { type: number }
            by_class:
              type: array
              items:
                allOf:
                  - type: object
                    properties:
                      class_id: { type: integer }
                      class_name: { type: string }
                  - $ref: '#/components/schemas/SummaryMetrics'
    StatsDistribution:
      type: object
      required: [total_score, actual_count, buckets]
      properties:
        total_score: { type: number }
        actual_count: { type: integer }
        buckets:
          type: array
          description: 固定 5 项，按得分率升序
          items:
            type: object
            required: [label, min_rate, max_rate, min_score, max_score, count, ratio]
            properties:
              label: { type: string, example: '[60%,70%)' }
              min_rate: { type: number, example: 60 }
              max_rate: { type: number, example: 70 }
              min_score: { type: number, description: 对应分数下界 = total_score × min_rate / 100 }
              max_score: { type: number }
              count: { type: integer }
              ratio: { type: number, description: 百分比 }
    QuestionStat:
      type: object
      required: [paper_question_id, seq, type, stem_summary, difficulty, tags, score, attempt_count, full_score_count,
                 avg_score, correct_rate, score_rate, option_stats]
      properties:
        paper_question_id: { type: integer }
        seq: { type: integer }
        type: { $ref: '#/components/schemas/QuestionType' }
        stem_summary: { type: string, description: 题干前 50 字 }
        difficulty: { $ref: '#/components/schemas/Difficulty' }
        tags:
          type: array
          items: { type: string }
        score: { type: number }
        attempt_count: { type: integer, description: 实考人数 }
        full_score_count: { type: integer }
        avg_score: { type: number, description: 保留 2 位小数 }
        correct_rate: { type: number, nullable: true, description: 客观题正确率百分比；简答为 null }
        score_rate: { type: number, description: 得分率百分比 }
        option_stats:
          type: array
          description: 仅 single/multiple，其余为 []
          items:
            type: object
            properties:
              key: { type: string }
              count: { type: integer }
              ratio: { type: number }
              is_correct: { type: boolean }

    # ---------- ADMIN ----------
    Overview:
      type: object
      required: [users, class_count, question_count, paper_count, exams]
      properties:
        users:
          type: object
          properties:
            admin: { type: integer }
            teacher: { type: integer }
            student: { type: integer }
            total: { type: integer }
        class_count: { type: integer }
        question_count: { type: integer, description: 未删除题目数 }
        paper_count: { type: integer }
        exams:
          type: object
          properties:
            not_started: { type: integer }
            ongoing: { type: integer }
            ended: { type: integer }
            cancelled: { type: integer }
            total: { type: integer }
