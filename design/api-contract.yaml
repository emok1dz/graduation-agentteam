    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [exams]
      operationId: getExam
      summary: 考试详情
      description: teacher 仅本人考试（40301）；admin 任意。
      x-roles: [teacher, admin]
      x-error-codes: [40100, 40300, 40301, 40400]
      responses:
        '200':
          description: 考试
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Exam' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [exams]
      operationId: updateExam
      summary: 【可选】修改 / 延长考试（FR-EXAM-02 P1）
      description: |
        not_started：可修改 ExamUpdateRequest 中任意字段（校验同发布）；
        ongoing：仅允许 end_time 且须晚于原 end_time，其他字段出现即 40902；作答中答卷的 deadline_at 按
        min(started_at + duration, 新 end_time) 重新计算；
        ended / cancelled：40902。
      x-optional: true
      x-roles: [teacher]
      x-error-codes: [40000, 40100, 40300, 40301, 40400, 40902]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExamUpdateRequest' }
      responses:
        '200':
          description: 更新后的考试
          content:
            application/json:
