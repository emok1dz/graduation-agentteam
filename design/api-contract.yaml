        - name: keyword
          in: query
          description: 考试名称模糊匹配
          schema: { type: string, maxLength: 50 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 分页考试列表
