    parameters:
      - $ref: '#/components/parameters/IdPath'
      - $ref: '#/components/parameters/ClassIdQuery'
    get:
      tags: [stats]
      operationId: getStatsSummary
      summary: 成绩概要统计（FR-STAT-03）
      description: |
        统计对象：status=graded 且 submit_type≠absent 的答卷。应考 = 参考班级学生数；实考 = 统计对象数；
        缺考 = absent 答卷数 + 考试结束后仍无答卷的学生数；无统计对象时 average/max/min 为 null、pass_rate 为 0。
        by_class 为各参考班级同口径指标（class_id 过滤时仅含该班）。
      x-roles: [teacher, admin]
      x-error-codes: [40000, 40100, 40300, 40301, 40400]
      responses:
        '200':
          description: 概要统计
