      summary: 【可选】导出成绩单 CSV（FR-STAT-06 P2）
      description: |
        列：排名,学号,姓名,班级,状态,交卷方式,交卷时间,客观分,主观分,总分,是否及格。UTF-8 带 BOM；
        Content-Disposition: attachment; filename*=UTF-8''<考试名称>-成绩单.csv。
        因需携带 Authorization 头，前端用 fetch 获取 Blob 后触发下载。错误时仍返回 JSON 错误信封。
      x-optional: true
      x-roles: [teacher, admin]
      x-error-codes: [40000, 40100, 40300, 40301, 40400]
      responses:
        '200':
          description: CSV 文件
          content:
