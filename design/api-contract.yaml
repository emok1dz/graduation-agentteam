      description: |
        先执行该考试兜底（强制交卷 + 生成缺考记录）。考试须为 ended（否则 40902）；已发布 40908；
        存在 pending_review 或 in_progress 答卷时 40907，data.pending_count 为剩余份数。
      x-roles: [teacher]
      x-error-codes: [40000, 40100, 40300, 40301, 40400, 40902, 40907, 40908]
      requestBody:
        required: false
        content:
